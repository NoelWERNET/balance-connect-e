name: balance_connect
description: Application de balance connectée via Bluetooth à une carte Arduino.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  bluetooth_classic: ^1.1.0
  encrypt: ^5.0.3
  fl_chart: ^0.68.0
  shared_preferences: ^2.2.3
  permission_handler: ^11.3.0
  intl: ^0.19.0
  pointycastle: ^3.7.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
